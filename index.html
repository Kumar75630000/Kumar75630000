<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECINET - Loading</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: linear-gradient(rgba(0, 86, 179, 0.8), rgba(0, 40, 85, 0.85)), url('logo.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }

        /* Center content container */
        .content-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        /* ECINET text in Light Blue */
        .brand-title {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
            color: #d0e8ff; /* Light Blue */
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        /* Voter Verification Portal text in Light Blue */
        .brand-subtitle {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 35px;
            color: #a2d2ff; /* Light Blue */
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        /* Centered Loading Spinner */
        .loader {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #a2d2ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="content-box">
        <div class="brand-title">ECINET</div>
        <div class="brand-subtitle">Voter Verification Portal</div>
        <div class="loader"></div>
    </div>

    <!-- 3 सेकंड के बाद ऑटोमैटिक अगले पेज पर रीडायरेक्ट -->
    <script>
        setTimeout(function() {
            window.location.href = "index.html"; 
        }, 3000);
    </script>

</body>
</html>
